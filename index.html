<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хранители планеты</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='36' fill='%23ffd15c'/%3E%3Ccircle cx='38' cy='46' r='5' fill='%23241b4b'/%3E%3Ccircle cx='62' cy='46' r='5' fill='%23241b4b'/%3E%3Cpath d='M36 64 Q50 76 64 64' fill='none' stroke='%23c2410c' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/games.css">
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>
  <div id="app">
    <header id="topbar">
      <button type="button" id="btn-back" class="btn btn-ghost btn-small" hidden>Назад</button>
      <div id="top-title">
        <strong id="top-heading">Хранители планеты</strong>
        <span id="top-sub"></span>
      </div>
      <div id="top-progress" hidden>
        <div class="bar" aria-hidden="true"><div id="top-bar"></div></div>
        <span id="top-count"></span>
      </div>
      <div id="top-actions">
        <button type="button" id="btn-album" class="btn btn-ghost btn-small" hidden>Альбом</button>
        <button type="button" id="btn-medals" class="btn btn-ghost btn-small" hidden>Награды</button>
        <button type="button" id="btn-retry" class="btn btn-ghost btn-small" hidden>Заново</button>
        <button type="button" id="btn-help" class="btn btn-blue btn-small" hidden aria-label="Как играть">?</button>
        <button type="button" id="btn-sound" class="btn btn-small" aria-pressed="true">Звук</button>
      </div>
    </header>
    <main id="screen"></main>
    <footer id="dock">
      <div id="mascot" role="img" aria-label="Талисман Лучик"></div>
      <p id="speech" aria-live="polite"></p>
    </footer>
  </div>
  <div id="modal" hidden>
    <div class="modal-back"></div>
    <div class="modal-window" role="dialog" aria-modal="true"></div>
  </div>
  <noscript><p>Для игры нужен JavaScript.</p></noscript>
  <!-- Обычные скрипты, не модули: так игра открывается двойным щелчком по index.html. -->
  <script src="js/util.js"></script>
  <script src="data/content.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/games/solar.js"></script>
  <script src="js/games/forest.js"></script>
  <script src="js/games/body.js"></script>
  <script src="js/games/russia.js"></script>
  <script src="js/games/time.js"></script>
  <script src="js/games/eco.js"></script>
  <script src="js/games/safety.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
